
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Compile check
        run: uv run python -m compileall -q main.py telemetry.py

      - name: Lint
        run: uvx ruff check .

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Compose file is valid
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync

      - run: uv run pytest -q
